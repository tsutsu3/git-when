name: Publish release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  publish:
    name: Publish release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Read the release version
        id: version
        run: |
          set -euo pipefail

          release_version="$(go run ./cmd/git-when --version)"
          semver_pattern='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          release_tag="v${release_version}"
          if [[ ! "$release_tag" =~ $semver_pattern ]]; then
            echo "Go version must be a semantic version such as 1.2.3" >&2
            exit 1
          fi
          echo "tag=${release_tag}" >> "$GITHUB_OUTPUT"

      - name: Publish the release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail

          is_draft="$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)"
          if [[ "$is_draft" != "true" ]]; then
            echo "${RELEASE_TAG} is not a draft release" >&2
            exit 1
          fi
          gh release edit "$RELEASE_TAG" \
            --draft=false \
            --prerelease=false \
            --latest
