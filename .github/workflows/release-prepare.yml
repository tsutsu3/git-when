name: Release preparation

on:
  push:
    branches:
      - "release-v*"

permissions:
  contents: read

concurrency:
  group: release-preparation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Read the release version
        id: version
        env:
          RELEASE_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          release_version="$(go run ./cmd/git-when --version)"
          semver_pattern='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          if [[ ! "$release_version" =~ $semver_pattern ]]; then
            echo "Go version must be a semantic version such as 1.2.3" >&2
            exit 1
          fi
          release_tag="v${release_version}"
          expected_branch="release-${release_tag}"
          if [[ "$RELEASE_BRANCH" != "$expected_branch" ]]; then
            echo "release branch must be named ${expected_branch}" >&2
            exit 1
          fi
          echo "version=${release_version}" >> "$GITHUB_OUTPUT"
          echo "tag=${release_tag}" >> "$GITHUB_OUTPUT"
          if git rev-parse --verify --quiet "refs/tags/${release_tag}" >/dev/null; then
            echo "${release_tag} already exists" >&2
            exit 1
          fi

      - name: Generate the changelog
        uses: orhun/git-cliff-action@v4.8.0
        with:
          version: v2.14.0
          config: cliff.toml
          args: --verbose --tag ${{ steps.version.outputs.tag }}
          github_token: ${{ github.token }}
        env:
          OUTPUT: CHANGELOG.md

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install frontend dependencies
        run: |
          corepack enable
          corepack pnpm install --frozen-lockfile

      - name: Verify the frontend
        run: |
          corepack pnpm test:template
          corepack pnpm lint:template
          corepack pnpm format:check
          corepack pnpm check:template

      - name: Verify the Go code
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test ./...

      - name: Lint the Go code
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2

      - name: Test the release build
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          CGO_ENABLED=0 go build \
            -trimpath \
            -ldflags="-s -w" \
            -o /tmp/git-when \
            ./cmd/git-when
          test "$(/tmp/git-when --version)" = "$RELEASE_VERSION"

      - name: Commit the changelog
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail

          if [[ -z "$(git status --porcelain -- CHANGELOG.md)" ]]; then
            echo "CHANGELOG.md is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "chore(release): update changelog for ${RELEASE_TAG}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
