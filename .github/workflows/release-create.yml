name: Create release

on:
  pull_request:
    branches:
      - main
    types:
      - closed

permissions:
  contents: read

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  create:
    name: Create draft release and deploy
    if: >-
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'release-v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Check out the merged commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Read the release version
        id: version
        env:
          RELEASE_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail

          release_version="$(go run ./cmd/git-when --version)"
          semver_pattern='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          if [[ ! "$release_version" =~ $semver_pattern ]]; then
            echo "Go version must be a semantic version such as 1.2.3" >&2
            exit 1
          fi
          release_tag="v${release_version}"
          expected_branch="release-${release_tag}"
          if [[ "$RELEASE_BRANCH" != "$expected_branch" ]]; then
            echo "release branch must be named ${expected_branch}" >&2
            exit 1
          fi
          echo "version=${release_version}" >> "$GITHUB_OUTPUT"
          echo "tag=${release_tag}" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install frontend dependencies
        run: |
          corepack enable
          corepack pnpm install --frozen-lockfile

      - name: Verify the frontend
        run: |
          corepack pnpm test:template
          corepack pnpm lint:template
          corepack pnpm format:check
          corepack pnpm check:template

      - name: Verify the Go code
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test ./...

      - name: Lint the Go code
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2

      - name: Extract release notes
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail

          heading="## [${RELEASE_TAG#v}]"
          awk -v heading="$heading" '
            index($0, heading) == 1 { found = 1 }
            found && /^## / && index($0, heading) != 1 { exit }
            found { print }
            END { if (!found) exit 1 }
          ' CHANGELOG.md > latest_changelog.md
          test -s latest_changelog.md

      - name: Build release archives
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          targets=(
            linux/amd64
            linux/arm64
            darwin/amd64
            darwin/arm64
            windows/amd64
            windows/arm64
          )

          mkdir -p dist staging
          for target in "${targets[@]}"; do
            target_os="${target%/*}"
            target_arch="${target#*/}"
            archive_name="git-when_${RELEASE_VERSION}_${target_os}_${target_arch}"
            archive_dir="staging/${archive_name}"
            executable="git-when"
            if [[ "$target_os" == "windows" ]]; then
              executable="git-when.exe"
            fi

            mkdir -p "$archive_dir"
            CGO_ENABLED=0 GOOS="$target_os" GOARCH="$target_arch" go build \
              -trimpath \
              -ldflags="-s -w" \
              -o "${archive_dir}/${executable}" \
              ./cmd/git-when
            cp README.md LICENSE CHANGELOG.md "$archive_dir/"

            if [[ "$target_os" == "windows" ]]; then
              (cd staging && zip -q -r "../dist/${archive_name}.zip" "$archive_name")
            else
              tar -C staging -czf "dist/${archive_name}.tar.gz" "$archive_name"
            fi
          done

          cd dist
          sha256sum git-when_*.tar.gz git-when_*.zip > checksums.txt

      - name: Generate the production report
        run: |
          mkdir -p build
          CGO_ENABLED=0 go build \
            -trimpath \
            -ldflags="-s -w" \
            -o build/git-when \
            ./cmd/git-when
          build/git-when .. \
            --format html \
            --out public/index.html \
            --max-depth 2 \
            --min-total 100 \
            --default-author tsutsu3 \
            --no-email

      - name: Validate the production deployment
        run: corepack pnpm exec wrangler deploy --dry-run --env prd

      - name: Create or update the draft release
        uses: ncipollo/release-action@v1.21.0
        with:
          allowUpdates: true
          artifactErrorsFailBuild: true
          artifacts: "dist/*"
          bodyFile: latest_changelog.md
          commit: ${{ github.event.pull_request.merge_commit_sha }}
          draft: true
          name: ${{ steps.version.outputs.tag }}
          prerelease: false
          replacesArtifacts: true
          tag: ${{ steps.version.outputs.tag }}
          token: ${{ secrets.GITHUB_TOKEN }}
          updateOnlyUnreleased: true

      - name: Deploy to Cloudflare production
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: corepack pnpm deploy:prd
