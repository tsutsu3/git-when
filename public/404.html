<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Page not found</title>
    <!-- The site sends a strict Content-Security-Policy from public/_headers. -->
    <!-- So this page uses one inline style and loads nothing from the network. -->
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --fg: #1f2328;
        --muted: #59636e;
        --accent: #0969da;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0d1117;
          --fg: #e6edf3;
          --muted: #9198a1;
          --accent: #4493f8;
        }
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: var(--bg);
        color: var(--fg);
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
        line-height: 1.6;
      }
      main {
        max-width: 32rem;
        text-align: center;
      }
      .code {
        margin: 0;
        font-size: 3.5rem;
        font-weight: 700;
        letter-spacing: 0.05em;
        color: var(--muted);
      }
      h1 {
        margin: 0.25rem 0 0.75rem;
        font-size: 1.25rem;
      }
      p {
        margin: 0 0 1rem;
        color: var(--muted);
      }
      a {
        color: var(--accent);
      }
    </style>
  </head>
  <body>
    <main>
      <p class="code">404</p>
      <h1>Page not found</h1>
      <p>This site serves one page. It is the git-when demo report.</p>
      <p><a href="/">Go to the report</a></p>
    </main>
  </body>
</html>
